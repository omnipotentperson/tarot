name: Download Tarot Card Images and Commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Make Script Executable
        run: chmod +x scripts/download-cards.sh

      - name: Run Downloader Script
        run: ./scripts/download-cards.sh

      - name: Check for Changes
        id: git-check
        run: |
          git status --porcelain
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Assets
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cards data/card-images.json
          git commit -m "chore: download tarot card assets and update image mapping"
          git push origin main
