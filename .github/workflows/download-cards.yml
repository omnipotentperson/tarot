name: Download Tarot Card Images and Commit

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch to commit images (optional)'
        required: false
        default: 'main'

concurrency:
  group: download-cards
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Set up job
        run: echo "Starting download-cards job"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl python3

      - name: Make downloader script executable
        run: |
          chmod +x scripts/download-cards.sh

      - name: Run downloader script
        id: run_downloader
        run: |
          ./scripts/download-cards.sh
          echo "Downloaded files summary (first 40):"
          ls -1 assets/cards | head -n 40 || true
          echo "Mapping file head (first 80 lines):"
          head -n 80 data/card-images.json || true

      - name: Upload mapping artifact for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-images-json
          path: data/card-images.json

      - name: Commit and push generated files (rebase or create PR)
        if: always()
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch || 'main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Target branch: ${TARGET_BRANCH}"
          git add assets/cards data/card-images.json || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Add/refresh local tarot card images (generated by workflow)"

          # Try to fast-forward via rebase onto remote branch if it exists
          git fetch origin "${TARGET_BRANCH}" || true
          if git rev-parse --verify "origin/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "origin/${TARGET_BRANCH} exists; attempting rebase"
            if git rebase "origin/${TARGET_BRANCH}"; then
              echo "Rebase succeeded"
            else
              echo "Rebase failed; aborting rebase and merging"
              git rebase --abort || true
              git merge --no-edit "origin/${TARGET_BRANCH}" || true
            fi
          else
            echo "origin/${TARGET_BRANCH} does not exist; will push new branch"
          fi

          # Try direct push to target branch
          if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
            echo "Pushed changes directly to ${TARGET_BRANCH}"
            exit 0
          fi

          echo "Direct push failed (protected branch or non-fast-forward). Creating feature branch and PR."

          BRANCH_NAME="images/generated-$(date +%s)"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"

          PR_TITLE="Add generated tarot card images"
          PR_BODY="This pull request was created by the download-cards workflow to add generated local tarot card images and the mapping file. Please review and merge."

          curl -s -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            -d "{\"title\":\"${PR_TITLE}\",\"head\":\"${BRANCH_NAME}\",\"base\":\"${TARGET_BRANCH}\",\"body\":\"${PR_BODY}\"}" \
            | tee /tmp/pr_response.json

          echo "Created PR (response saved to /tmp/pr_response.json)"
