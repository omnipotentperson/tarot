<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Veil — Tarot & Astrology</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#c9a84c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Veil">
<meta name="description" content="Tarot readings, astrology, birth charts, and divination">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0a12;
    --parchment: #f5ede0;
    --gold: #c9a84c;
    --gold-light: #e8c97e;
    --gold-dim: #7a6228;
    --crimson: #7c2035;
    --violet: #2e1a4a;
    --smoke: #1a1226;
    --card-bg: #130d1e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ink);
    color: var(--parchment);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 17px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(46,26,74,0.9) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(124,32,53,0.4) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(13,10,18,1) 0%, transparent 100%);
    z-index: -2;
  }

  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 15% 20%, rgba(255,255,220,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 42% 8%, rgba(255,255,220,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 67% 30%, rgba(255,255,220,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 15%, rgba(255,255,220,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 5% 55%, rgba(201,168,76,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 70%, rgba(255,255,220,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 65%, rgba(255,255,220,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 93% 80%, rgba(201,168,76,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 88%, rgba(255,255,220,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 92%, rgba(255,255,220,0.4) 0%, transparent 100%);
    z-index: -1;
    pointer-events: none;
  }

  header {
    text-align: center;
    padding: 52px 20px 32px;
    position: relative;
  }

  header::after {
    content: '';
    display: block;
    width: 340px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 18px auto 0;
  }

  .site-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    color: var(--gold-light);
    letter-spacing: 0.12em;
    text-shadow: 0 0 40px rgba(201,168,76,0.5), 0 0 80px rgba(201,168,76,0.2);
    line-height: 1.15;
  }

  .site-sub {
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 0.35em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-top: 6px;
  }

  nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 20px 20px 0;
  }

  .nav-btn {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-dim);
    background: transparent;
    border: 1px solid rgba(201,168,76,0.25);
    padding: 9px 18px;
    cursor: pointer;
    transition: all 0.3s;
    border-radius: 1px;
  }

  .nav-btn:hover, .nav-btn.active {
    color: var(--gold-light);
    border-color: var(--gold);
    background: rgba(201,168,76,0.07);
    text-shadow: 0 0 12px rgba(201,168,76,0.4);
  }

  .section {
    display: none;
    max-width: 960px;
    margin: 0 auto;
    padding: 44px 20px 60px;
    animation: fadeUp 0.5s ease both;
  }

  .section.visible { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 1.5rem;
    color: var(--gold-light);
    text-align: center;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }

  .section-desc {
    text-align: center;
    color: rgba(245,237,224,0.55);
    font-style: italic;
    margin-bottom: 36px;
    font-size: 1rem;
  }

  .ornament {
    text-align: center;
    color: var(--gold-dim);
    font-size: 1.4rem;
    margin: 0 0 28px;
    opacity: 0.7;
  }

  .spread-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 14px;
    margin-bottom: 36px;
  }

  .spread-card {
    border: 1px solid rgba(201,168,76,0.22);
    padding: 18px 14px;
    cursor: pointer;
    text-align: center;
    transition: all 0.3s;
    background: rgba(201,168,76,0.03);
    border-radius: 2px;
  }

  .spread-card:hover, .spread-card.selected {
    border-color: var(--gold);
    background: rgba(201,168,76,0.1);
    box-shadow: 0 0 20px rgba(201,168,76,0.1);
  }

  .spread-card .spread-icon { font-size: 1.8rem; margin-bottom: 8px; display: block; }

  .spread-card .spread-name {
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    color: var(--gold);
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 5px;
  }

  .spread-card .spread-count {
    font-size: 0.78rem;
    color: rgba(245,237,224,0.45);
    font-style: italic;
  }

  .draw-btn {
    display: block;
    margin: 0 auto 40px;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink);
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
    border: none;
    padding: 14px 42px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 0 24px rgba(201,168,76,0.35);
  }

  .draw-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 36px rgba(201,168,76,0.5);
  }

  .draw-btn:disabled {
    opacity: 0.5; cursor: not-allowed; transform: none;
  }

  .cards-area {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    margin-bottom: 32px;
  }

  .fan-area {
    position: relative;
    height: 320px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-bottom: 40px;
    overflow: visible;
  }

  .fan-wrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
    height: 260px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }

  .fan-card {
    position: absolute;
    bottom: 0;
    width: 70px; height: 115px;
    background: linear-gradient(160deg, #1e1233 0%, #130d1e 100%);
    background-image: url('card-back.png');
    background-size: cover;
    background-position: center;
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 5px;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s;
    transform-origin: bottom center;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .fan-card.no-img::before {
    content: '★';
    color: rgba(201,168,76,0.35);
    font-size: 1.2rem;
  }

  .fan-card:hover {
    box-shadow: 0 -8px 30px rgba(201,168,76,0.4);
    border-color: var(--gold);
    z-index: 20 !important;
  }

  .fan-card.chosen {
    border-color: var(--gold-light);
    box-shadow: 0 -12px 40px rgba(201,168,76,0.6);
  }

  .fan-instruction {
    text-align: center;
    color: rgba(245,237,224,0.5);
    font-style: italic;
    margin-bottom: 16px;
    font-size: 0.95rem;
  }

  .tarot-card-wrap {
    text-align: center;
    animation: revealCard 0.6s ease both;
  }

  .tarot-card-wrap .position-label {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  @keyframes revealCard {
    from { opacity: 0; transform: scale(0.85) rotateY(90deg); }
    to { opacity: 1; transform: scale(1) rotateY(0deg); }
  }

  .tarot-card-inner {
    width: 130px;
    background: linear-gradient(160deg, #1e1233 0%, #130d1e 100%);
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 6px;
    padding: 10px 8px 12px;
    display: inline-block;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,168,76,0.1) inset;
    cursor: pointer;
  }

  .tarot-card-inner.reversed {
    transform: rotate(180deg);
    border-color: rgba(124,32,53,0.6);
  }

  .card-img-wrap {
    width: 114px; height: 190px;
    overflow: hidden;
    border-radius: 3px;
    background: #0a0612;
    margin-bottom: 8px;
    display: flex; align-items: center; justify-content: center;
  }

  .card-img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-img-wrap .card-no-img {
    font-size: 2.5rem;
    color: rgba(201,168,76,0.3);
  }

  .card-name-tag {
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    color: var(--gold);
    letter-spacing: 0.08em;
    text-align: center;
    line-height: 1.4;
  }

  .reversed-tag {
    font-size: 0.58rem;
    color: var(--crimson);
    display: block;
    letter-spacing: 0.15em;
    margin-top: 2px;
  }

  .tarot-card-wrap {
    position: relative;
  }

  .tarot-card-wrap .card-meaning {
    display: none;
  }

  .card-tooltip {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    background: #1a1226;
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 0.78rem;
    color: rgba(245,237,224,0.85);
    font-style: italic;
    line-height: 1.55;
    text-align: center;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    transform: translateX(-50%) translateY(4px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }

  .card-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: rgba(201,168,76,0.4);
  }

  .tarot-card-wrap:hover .card-tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .reading-panel {
    background: rgba(46,26,74,0.3);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 4px;
    padding: 28px 30px;
    margin-top: 32px;
    position: relative;
    overflow: hidden;
  }

  .reading-panel::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }

  .reading-panel-title {
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .reading-panel-title::after {
    content: '';
    flex: 1; height: 1px;
    background: rgba(201,168,76,0.15);
  }

  .reading-text {
    line-height: 1.85;
    color: rgba(245,237,224,0.85);
    font-size: 1rem;
  }

  .reading-text p { margin-bottom: 1em; }

  .loading-dots span {
    display: inline-block;
    animation: blink 1.4s infinite both;
    color: var(--gold);
    font-size: 1.4rem;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  .library-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .lib-filter-btn {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid rgba(201,168,76,0.25);
    color: var(--gold-dim);
    padding: 7px 16px;
    cursor: pointer;
    transition: all 0.25s;
  }

  .lib-filter-btn:hover, .lib-filter-btn.active {
    border-color: var(--gold);
    color: var(--gold-light);
    background: rgba(201,168,76,0.08);
  }

  .lib-search {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.25);
    color: var(--parchment);
    font-family: 'EB Garamond', serif;
    font-size: 0.95rem;
    padding: 8px 16px;
    width: 260px;
    outline: none;
    transition: border 0.25s;
  }

  .lib-search:focus { border-color: var(--gold); }
  .lib-search::placeholder { color: rgba(245,237,224,0.3); font-style: italic; }

  .lib-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  .lib-card {
    border: 1px solid rgba(201,168,76,0.18);
    background: rgba(201,168,76,0.02);
    padding: 12px 10px 14px;
    cursor: pointer;
    text-align: center;
    transition: all 0.25s;
    border-radius: 2px;
  }

  .lib-card:hover {
    border-color: var(--gold);
    background: rgba(201,168,76,0.07);
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }

  .lib-card .lc-img {
    width: 70px; height: 116px;
    margin: 0 auto 10px;
    background: #0a0612;
    border-radius: 3px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  .lib-card .lc-img img { width: 100%; height: 100%; object-fit: cover; }
  .lib-card .lc-img span { color: rgba(201,168,76,0.3); font-size: 1.5rem; }

  .lib-card .lc-name {
    font-family: 'Cinzel', serif;
    font-size: 0.67rem;
    color: var(--gold);
    letter-spacing: 0.08em;
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .lib-card .lc-suit {
    font-size: 0.7rem;
    color: rgba(245,237,224,0.35);
    font-style: italic;
  }

  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open { display: flex; }

  .modal-box {
    background: var(--smoke);
    border: 1px solid rgba(201,168,76,0.4);
    max-width: 680px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 36px;
    position: relative;
    animation: fadeUp 0.3s ease;
  }

  .modal-close {
    position: absolute; top: 16px; right: 20px;
    background: none; border: none;
    color: var(--gold-dim); font-size: 1.4rem; cursor: pointer;
  }

  .modal-close:hover { color: var(--gold); }

  .modal-card-header {
    display: flex;
    gap: 24px;
    margin-bottom: 24px;
    align-items: flex-start;
  }

  .modal-img-wrap {
    width: 110px; min-width: 110px; height: 184px;
    background: #0a0612;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid rgba(201,168,76,0.3);
    display: flex; align-items: center; justify-content: center;
  }

  .modal-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .modal-img-wrap span { color: rgba(201,168,76,0.3); font-size: 2rem; }

  .modal-card-info h2 {
    font-family: 'Cinzel', serif;
    color: var(--gold-light);
    font-size: 1.3rem;
    margin-bottom: 8px;
  }

  .modal-card-info .badge {
    display: inline-block;
    font-size: 0.68rem;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.15em;
    padding: 3px 10px;
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold-dim);
    margin-right: 6px;
    margin-bottom: 12px;
  }

  .modal-card-info p {
    font-size: 0.92rem;
    color: rgba(245,237,224,0.7);
    line-height: 1.7;
    font-style: italic;
  }

  .modal-meanings h3 {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin: 20px 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(201,168,76,0.15);
  }

  .modal-meanings p {
    font-size: 0.9rem;
    color: rgba(245,237,224,0.75);
    line-height: 1.7;
  }

  .astro-form {
    max-width: 400px;
    margin: 0 auto 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .form-group label {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
    text-transform: uppercase;
    display: block;
    margin-bottom: 8px;
  }

  .form-group input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.25);
    color: var(--parchment);
    font-family: 'EB Garamond', serif;
    font-size: 1rem;
    padding: 10px 14px;
    outline: none;
    transition: border 0.25s;
    border-radius: 1px;
  }

  .form-group input:focus { border-color: var(--gold); }

  .zodiac-display {
    text-align: center;
    margin-bottom: 32px;
  }

  .zodiac-symbol {
    font-size: 4rem;
    display: block;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 20px rgba(201,168,76,0.5));
  }

  .zodiac-name {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    color: var(--gold-light);
    letter-spacing: 0.12em;
  }

  .zodiac-dates {
    font-size: 0.85rem;
    color: rgba(245,237,224,0.45);
    font-style: italic;
    margin-top: 4px;
  }

  .horoscope-tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
  }

  .horoscope-text {
    background: rgba(46,26,74,0.3);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 4px;
    padding: 24px 28px;
    line-height: 1.85;
    color: rgba(245,237,224,0.85);
    font-size: 1rem;
  }


  /* ── BIRTH CHART ── */
  .birth-chart-form {
    max-width: 500px;
    margin: 0 auto 36px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .birth-chart-form .full-width { grid-column: 1 / -1; }

  .chart-wheel-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 32px;
  }

  .chart-wheel-wrap svg {
    max-width: 480px;
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 0 30px rgba(201,168,76,0.15));
  }
  .chart-wheel-wrap {
    background: #0d0a12;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
  }

  .planet-table {
    width: 100%;
    max-width: 600px;
    margin: 0 auto 32px;
    border-collapse: collapse;
  }

  .planet-table th {
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    color: var(--gold-dim);
    text-transform: uppercase;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(201,168,76,0.2);
    text-align: left;
  }

  .planet-table td {
    font-size: 0.88rem;
    color: rgba(245,237,224,0.8);
    padding: 9px 12px;
    border-bottom: 1px solid rgba(201,168,76,0.07);
  }

<!-- Minimal runtime script to correct any remaining mojibake in dynamically inserted text -->
<script>
  (function fixMojibake(root){
    if(!root) root = document;
    const mappings = {
      'â€”': '—',
      'â€“': '–',
      'â€™': '’',
      'â€œ': '“',
      'â€\\u009d': '”',
      'â€¢': '•',
      'â”€': '─',
      'á›Ÿ': '★'
    };
    function replaceText(node){
      if(node.nodeType === 3){
        let text = node.nodeValue;
        let changed = false;
        for(const k in mappings){
          if(text.indexOf(k) !== -1){ text = text.split(k).join(mappings[k]); changed = true; }
        }
        if(changed) node.nodeValue = text;
      } else if(node.nodeType === 1 && node.childNodes && node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE'){
        node.childNodes.forEach(replaceText);
      }
    }
    // run after DOM ready
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => replaceText(document.body));
    else replaceText(document.body);
    // also fix document.title
    if(typeof document.title === 'string'){
      let t = document.title;
      for(const k in mappings) t = t.split(k).join(mappings[k]);
      document.title = t;
    }
  })();
</script>
